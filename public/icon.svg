           L 70.2 331.5 77.0 321.2 85.5 316.8 96.5 316.8 103.5 319.8 111.2 329.5
           L 115.2 345.0 119.5 348.2 129.0 348.2 133.2 344.5 134.8 339.0 133.8 274.0
           L 99.0 256.8 90.5 250.8 76.8 236.5 70.8 223.5 69.2 208.0 71.8 181.0
           L 80.8 148.0 89.8 128.5 102.2 107.5 112.2 95.0 130.5 76.2 145.5 64.2
           L 164.5 52.2 198.0 38.2 233.0 31.2 268.0 31.2 300.0 37.2 318.5 43.8
           L 339.0 53.2 368.5 73.8 390.8 96.5 409.8 124.5 424.2 158.5 431.8 195.0
