<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Full-bleed on purpose: the web favicon, the Windows .ico and the Linux PNGs
    all want the canvas filled. macOS is the exception — it needs an 824/1024
    safe-area inset — and that inset is applied when building icon.icns:

        python3 src-tauri/icons/macos-icon.gen.py

    Re-run it after changing anything below, or the Dock icon keeps the old art.

    The octopus is a traced silhouette (marching squares at 1024px, then
    Ramer-Douglas-Peucker at eps 0.8): 0.993 silhouette IoU against the source
    mark and a mean colour error under 1/255. The gradient stops and axis are
    least-squares fits of the source's own fill, not eyeballed.
  -->
  <defs>
    <linearGradient id="octo" gradientUnits="userSpaceOnUse"
      x1="-139.8" y1="355.8" x2="27.7" y2="-70.4">
      <stop offset="0" style="stop-color:#30ddfd"/>
      <stop offset="0.5" style="stop-color:#68c3fc"/>
      <stop offset="1" style="stop-color:#9fa9fc"/>
    </linearGradient>
  </defs>

  <!-- White tile. Full-bleed white keeps the favicon/.ico/PNG canvases filled;
       macOS gets its 824/1024 safe area from icon.icns. -->
  <rect x="0" y="0" width="512" height="512" rx="90" ry="90" fill="#ffffff"/>

  <path fill="url(#octo)" d="M 338.5 478.2 313.5 479.2 302.5 478.2 297.0 476.2 286.5 469.2 279.2 462.5
           L 267.2 441.5 266.2 433.5 266.2 295.0 263.5 288.8 249.5 288.2 244.8 292.5
           L 244.2 436.0 240.8 445.0 230.2 464.0 221.0 471.8 211.5 476.8 197.0 479.2
           L 174.5 478.8 162.0 474.2 148.2 463.0 142.2 454.0 137.8 444.0 134.8 427.0
           L 136.2 418.0 140.2 411.5 150.5 404.8 157.5 403.8 165.5 405.8 172.8 410.5
