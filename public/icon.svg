           L 396.0 392.2 372.0 391.2 353.0 382.2 342.2 371.0 334.2 356.5 331.8 284.5
           L 326.5 281.8 316.5 283.2 310.8 287.5 310.2 432.5 312.0 431.8 317.0 436.2
